<style>
  :root{
    --accent:#2f39c9;
    --accent-2:#4750e6;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
    --serif:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
    background:#eef0fe;
    color:#1a2028;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .stack{
    width:min(100%,380px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  .card{
    width:100%;
    background:linear-gradient(160deg,var(--accent) 0%,var(--accent-2) 100%);
    border-radius:22px;
    padding:28px 26px 24px;
    color:#fff;
    box-shadow:0 18px 48px rgba(47,57,201,.28);
    position:relative;
    overflow:hidden;
  }
  .card::after{
    content:"";
    position:absolute;
    top:-40%;right:-20%;
    width:70%;height:120%;
    background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);
    pointer-events:none;
  }
  .card > *{position:relative;z-index:1;}
  .mark{
    width:52px;height:52px;
    border-radius:14px;
    background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;letter-spacing:-.02em;
    margin-bottom:18px;
  }
  .card h1{
    font-family:var(--serif);
    font-size:28px;font-weight:600;
    margin:0;letter-spacing:-.02em;
  }
  .role{margin:6px 0 0;font-size:14.5px;font-weight:500;color:rgba(238,240,254,.95);}
  .tagline{margin:4px 0 0;font-size:13.5px;color:rgba(220,224,252,.9);}
  .details{
    margin-top:22px;padding-top:18px;
    border-top:1px solid rgba(255,255,255,.2);
    display:grid;gap:10px;
  }
  .row{
    display:flex;align-items:center;gap:10px;
    font-size:13.5px;color:rgba(255,255,255,.92);
    text-decoration:none;
  }
  a.row{color:inherit;}
  a.row:active{opacity:.85;}
  .row svg{width:16px;height:16px;fill:currentColor;flex:none;opacity:.85;}
  .qr{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 8px 28px rgba(47,57,201,.12);
  }
  .qr img{display:block;width:min(72vw,200px);height:auto;}
  @media(max-width:640px){
    .card{border-radius:18px;padding:24px 20px 20px;}
    .card h1{font-size:24px;}
  }
</style>
</head>
<body>

    <h1>Thomas Gollogly</h1>

      <a class="row" href="tel:+447513468009"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>07513 468009</a>
      <span class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Northern Ireland</span>
      <a class="row" href="https://tgollogly.dev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.69 3.5 9.5V21a1 1 0 0 0 1 1H9v-7h6v7h4.5a1 1 0 0 0 1-1V9.5L12 2.69z"/></svg>tgollogly.dev</a>

</body>
