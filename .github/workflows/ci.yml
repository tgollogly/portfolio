name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run full test suite (≥100 tests, ≥99% pass)
        run: node tests/run-all.mjs
      - name: Run legacy pursuit checks
        run: node games/the-pursuit/test-questions.mjs

  # Auto-deploy portfolio1 when main passes tests (Mom's weather, Pursuit, portfolio site).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy portfolio1 to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add GitHub secret CLOUDFLARE_API_TOKEN to auto-deploy on merge to main."
            exit 1
          fi
          bash scripts/deploy-portfolio1.sh
