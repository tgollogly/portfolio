
name = "portfolio1"
main = "server.js"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

# AI chat + ATS matcher need GEMINI_API_KEY set as an encrypted secret:
#   Cloudflare dashboard → Workers & Pages → portfolio1 → Settings →
#   Variables and Secrets → Add → Secret → name: GEMINI_API_KEY
# Or locally: copy .dev.vars.example to .dev.vars and run `npx wrangler dev`

# Access challenge (Facebook-linked abuse): set TURNSTILE_SITE_KEY + TURNSTILE_SECRET_KEY
# from Cloudflare Turnstile. Toggle in server.js: ACCESS_CHALLENGE_ENABLED, CHALLENGE_NI_GEO.

[[kv_namespaces]]
binding = "PURSUIT_KV"
id = "3959b665a51148bea2e6a518f58c2d5f"

[assets]
directory = "."
binding = "ASSETS"
