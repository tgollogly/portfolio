<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>
<meta name="googlebot" content="noindex,nofollow"/>
<meta name="color-scheme" content="dark"/>
<title>Bettystown — storm</title>
<meta name="description" content="Torrential rain and thunderstorms at Bettystown."/>
<link rel="icon" type="image/png" sizes="32x32" href="/bettystown/favicon-32.png"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
body{overflow:hidden;touch-action:manipulation}
.stage{
  position:fixed;inset:0;width:100%;height:100%;
  height:100dvh;min-height:-webkit-fill-available;
  background:#0a0f18;
}
#storm{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  background:#0a0f18;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.45) 100%);
}
.label{
  position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:10px 16px;border-radius:999px;
  font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.88);
  background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;white-space:nowrap;
}
</style>
</head>
<body>
<div class="stage">
  <!-- muted required for autoplay without a tap; script unmutes as soon as playback starts -->
  <video id="storm" autoplay loop playsinline webkit-playsinline muted preload="auto">
    <source src="video/storm-loop.mp4" type="video/mp4"/>
  </video>
  <div class="vignette" aria-hidden="true"></div>
  <p class="label" aria-hidden="true">Bettystown · torrential rain</p>
</div>
<script>
(function(){
  var v=document.getElementById("storm");
  if(!v) return;
  v.volume=1;
  var unmuteTicks=0;
  var unmuteTimer=null;

  function enableSound(){
    if(!v) return;
    v.muted=false;
    v.volume=1;
    if(v.paused){
      var p=v.play();
      if(p&&p.catch) p.catch(function(){});
    }
  }

  function kickAutoplay(){
    v.muted=true;
    var p=v.play();
    if(!p||!p.then){
      enableSound();
      return;
    }
    p.then(function(){
      enableSound();
      if(unmuteTimer) return;
      unmuteTimer=setInterval(function(){
        unmuteTicks+=1;
        enableSound();
        if(!v.muted||unmuteTicks>40) clearInterval(unmuteTimer);
      },100);
    }).catch(function(){
      setTimeout(kickAutoplay,200);
    });
  }

  v.addEventListener("playing",enableSound);
  v.addEventListener("loadeddata",kickAutoplay,{once:true});
  v.addEventListener("canplay",kickAutoplay,{once:true});
  kickAutoplay();

  document.addEventListener("visibilitychange",function(){
    if(document.hidden) return;
    if(v.paused) kickAutoplay();
    else enableSound();
  });
})();
</script>
</body>
</html>
