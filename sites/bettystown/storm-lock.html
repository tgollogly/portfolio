<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>
<meta name="googlebot" content="noindex,nofollow"/>
<meta name="color-scheme" content="dark"/>
<title>Bettystown — storm</title>
<meta name="description" content="Torrential rain and thunderstorms at Bettystown."/>
<link rel="icon" type="image/png" sizes="32x32" href="/bettystown/favicon-32.png"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
body{overflow:hidden;touch-action:manipulation}
.stage{
  position:fixed;inset:0;width:100%;height:100%;
  height:100dvh;min-height:-webkit-fill-available;
  background:#0a0f18;
}
#storm{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  background:#0a0f18;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.45) 100%);
}
.label{
  position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:10px 16px;border-radius:999px;
  font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.88);
  background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;white-space:nowrap;
}
.unmute{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,.55);border:none;cursor:pointer;
  font:600 1.05rem system-ui,sans-serif;color:#fff;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.unmute.show{opacity:1;pointer-events:auto}
.unmute:focus-visible{outline:2px solid #38bdf8;outline-offset:4px}
</style>
</head>
<body>
<div class="stage">
  <video id="storm" autoplay loop playsinline preload="auto" poster="">
    <source src="video/storm-loop.mp4" type="video/mp4"/>
  </video>
  <div class="vignette" aria-hidden="true"></div>
  <p class="label" aria-hidden="true">Bettystown · torrential rain</p>
  <button type="button" class="unmute" id="unmute" hidden>Tap for storm sound</button>
</div>
<script>
(function(){
  var v=document.getElementById("storm");
  var btn=document.getElementById("unmute");
  if(!v) return;
  v.volume=1;
  function tryPlay(){
    v.muted=false;
    var p=v.play();
    if(p&&p.then){
      p.then(function(){ if(btn) btn.hidden=true; }).catch(function(){
        v.muted=true;
        v.play().catch(function(){});
        if(btn){ btn.hidden=false; btn.classList.add("show"); }
      });
    }
  }
  if(btn){
    btn.addEventListener("click",function(){
      v.muted=false;
      v.play().then(function(){ btn.classList.remove("show"); btn.hidden=true; }).catch(function(){});
    });
  }
  v.addEventListener("loadeddata",tryPlay,{once:true});
  tryPlay();
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden) tryPlay();
  });
})();
</script>
</body>
</html>
