<style>
:root{
  --studio:#070d18;--panel:#0f1a2e;--lit:#1a2d4a;--gold:#e8c547;--gold2:#f5df7a;
  --cyan:#4ecdc4;--red:#e63946;--chaser:#9d0208;--text:#f0f4ff;--muted:#8fa3c4;
  --glow:0 0 40px rgba(232,197,71,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--studio);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;touch-action:manipulation;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% -10%,rgba(78,205,196,.12),transparent 55%),
  radial-gradient(ellipse 60% 40% at 50% 100%,rgba(157,2,8,.15),transparent 50%),
  url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 12px 28px;min-height:100dvh;display:flex;flex-direction:column}
header{text-align:center;margin-bottom:10px}
.logo{font-size:clamp(1.5rem,5vw,2rem);font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 8px rgba(232,197,71,.3))}
.tag{font-size:.78rem;color:var(--muted);margin:4px 0 0;line-height:1.35}
.studio-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 12px;font-size:.72rem;color:var(--muted)}
.chip b{color:var(--gold);font-weight:700}
.panel{background:linear-gradient(165deg,var(--panel),var(--lit));border:1px solid rgba(232,197,71,.2);border-radius:16px;padding:16px;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.06);margin-bottom:12px}
.panel h2{margin:0 0 8px;font-size:1rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:8px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.stat b{display:block;font-size:1.15rem;color:var(--gold)}
.stat span{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.track-wrap{margin:12px 0 8px;padding:10px 8px;background:rgba(0,0,0,.35);border-radius:12px;border:1px solid rgba(255,255,255,.08)}
.track{display:flex;align-items:center;justify-content:space-between;position:relative;height:56px;padding:0 4px}
.track::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:4px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--red));border-radius:2px;transform:translateY(-50%);opacity:.5}
.step{flex:1;display:flex;justify-content:center;position:relative;z-index:1}
.step-dot{width:14px;height:14px;border-radius:50%;background:#2a3a55;border:2px solid #4a5a75;transition:transform .3s,box-shadow .3s,background .3s}
.step.win .step-dot{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 12px rgba(232,197,71,.6)}
.marker{position:absolute;top:-2px;transform:translateX(-50%);transition:left .55s cubic-bezier(.34,1.4,.64,1);z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px}
.marker span{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.marker.player span{color:var(--cyan)}
.marker.chaser span{color:var(--red)}
.marker .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:3px solid;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.marker.player .av{border-color:var(--cyan);background:linear-gradient(145deg,#1a4a55,#0d2830)}
.marker.chaser .av{border-color:var(--red);background:linear-gradient(145deg,#5a0a10,#2a0508)}
.q-text{font-size:clamp(.95rem,3.5vw,1.12rem);line-height:1.45;margin:0 0 14px;min-height:3.2em}
.timer-bar{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-bottom:12px}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));width:100%;transition:width .1s linear;border-radius:3px}
.timer-fill.urgent{background:linear-gradient(90deg,var(--red),#ff6b6b);animation:pulse .5s infinite alternate}
@keyframes pulse{to{opacity:.6}}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;font:inherit;font-size:.92rem;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);color:var(--text);cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:rgba(232,197,71,.45);background:rgba(232,197,71,.08)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.correct{border-color:#2ecc71;background:rgba(46,204,113,.15);animation:flashG .4s}
.opt.wrong{border-color:var(--red);background:rgba(230,57,70,.15);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes flashG{50%{box-shadow:0 0 20px rgba(46,204,113,.5)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{text-align:center;font-size:.88rem;color:var(--gold);min-height:1.4em;margin:8px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:8px}
.btn{font:inherit;font-weight:700;border:none;border-radius:12px;padding:12px 18px;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;box-shadow:0 4px 16px rgba(232,197,71,.25);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.15);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.diff-btn{padding:14px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.2);color:var(--text);font:inherit;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.diff-btn.selected{border-color:var(--gold);background:rgba(232,197,71,.1)}
.diff-btn b{display:block;font-size:.85rem;color:var(--gold);margin-bottom:2px}
.diff-btn small{font-size:.68rem;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:24px 20px;max-width:340px;text-align:center;animation:popIn .35s ease}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 8px;color:var(--gold);font-size:1.2rem}
.modal p{margin:0 0 16px;color:var(--muted);font-size:.9rem;line-height:1.45}
.spotlight{position:fixed;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(232,197,71,.08),transparent 70%);pointer-events:none;z-index:0;animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(10vw,10vh)}to{transform:translate(60vw,30vh)}}
.legal{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.4;margin-top:10px}
@media(max-width:380px){.diff-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="spotlight" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="logo">The Pursuit</div>
    <p class="tag">Original UK studio quiz — Cash Builder, Head-to-Head &amp; Final Chase.<br/>Fan-made demo. Not affiliated with any TV broadcast or trademark.</p>
  </header>
  <div class="studio-bar">
    <div class="chip">Level <b id="levelLbl">1</b></div>
    <div class="chip">Pot <b id="potLbl">£0</b></div>
    <div class="chip">Round <b id="roundLbl">—</b></div>
  </div>
  <div id="screen"></div>
  <p class="msg" id="msg"></p>
  <div class="controls" id="controls"></div>
  <p class="legal">Hidden from search engines. Questions are original or general knowledge. No copyrighted show assets used.</p>
</div>
<div class="overlay" id="overlay"><div class="modal"><h3 id="modalTitle">Result</h3><p id="modalText"></p><button type="button" class="btn" id="modalBtn">Continue</button></div></div>
<script src="questions.js"></script>
<script>
(function(){
"use strict";

var DIFF={
  rookie:{label:"Rookie",chaser:.62,cash:500,time:90,pool:["easy","medium"],desc:"Gentler chaser · longer clock"},
  standard:{label:"Standard",chaser:.74,cash:1000,time:75,pool:["easy","medium","hard"],desc:"Balanced · like a weekday show"},
  expert:{label:"Expert",chaser:.84,cash:1500,time:60,pool:["medium","hard"],desc:"Sharper chaser · tougher facts"},
  legend:{label:"Legend",chaser:.93,cash:2000,time:50,pool:["hard","expert"],desc:"Elite chaser · brutal timer"}
};

var ROUNDS=["Cash Builder","Head-to-Head","Final Chase"];
var state={},timerId=null,audioCtx=null,musicOn=true;

function $(id){return document.getElementById(id);}
function setMsg(t){$("msg").textContent=t||"";}
function updateHud(){
  $("levelLbl").textContent=String(state.level||1);
  $("potLbl").textContent="£"+(state.pot||0).toLocaleString("en-GB");
  $("roundLbl").textContent=ROUNDS[state.round]||"Setup";
}

function initAudio(){
  if(audioCtx)return;
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function tone(freq,dur,type,vol){
  if(!audioCtx||!musicOn)return;
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  g.gain.value=vol||.08;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxCorrect(){tone(880,.12,"sine",.1);setTimeout(function(){tone(1100,.15,"sine",.08);},80);}
function sfxWrong(){tone(180,.25,"square",.06);tone(120,.3,"sawtooth",.04);}
function sfxCash(){tone(660,.08,"triangle",.07);setTimeout(function(){tone(990,.1,"triangle",.06);},60);}
function sfxMove(){tone(440,.06,"sine",.05);}

var musicTimer=null;
function startMusic(){
  if(!audioCtx||!musicOn||musicTimer)return;
  var scale=[220,247,262,294,330,349,392],i=0;
  musicTimer=setInterval(function(){
    if(!musicOn||state.phase==="menu")return;
    tone(scale[i%scale.length],.18,"triangle",.025);
    i++;
  },480);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function pickQuestions(n){
  var pool=DIFF[state.diff].pool;
  var bank=window.QUIZ_BANK.filter(function(q){return pool.indexOf(q.d)>=0;});
  return shuffle(bank).slice(0,n);
}

function renderTrack(playerStep,chaserStep,steps){
  steps=steps||7;
  var html='<div class="track-wrap"><div class="track" id="trackEl">';
  for(var s=0;s<=steps;s++){
    html+='<div class="step'+(s===steps?' win':'')+'"><div class="step-dot"></div></div>';
  }
  var pw=(playerStep/steps)*84+8,pct=(chaserStep/steps)*84+8;
  html+='<div class="marker player" id="playerMark" style="left:'+pw+'%"><div class="av">🎯</div><span>You</span></div>';
  html+='<div class="marker chaser" id="chaserMark" style="left:'+pct+'%"><div class="av">🏹</div><span>Chaser</span></div>';
  html+='</div></div>';
  return html;
}

function moveMarkers(pStep,cStep,steps){
  steps=steps||7;
  var p=$("playerMark"),c=$("chaserMark");
  if(p)p.style.left=(pStep/steps*84+8)+"%";
  if(c)c.style.left=(cStep/steps*84+8)+"%";
}

function showModal(title,text,cb){
  $("modalTitle").textContent=title;
  $("modalText").textContent=text;
  $("overlay").classList.add("show");
  $("modalBtn").onclick=function(){$("overlay").classList.remove("show");if(cb)cb();};
}

function clearTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

function renderQuestion(q,opts){
  var html='<div class="panel"><h2>'+ROUNDS[state.round]+'</h2>';
  if(state.timerMax){
    html+='<div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>';
  }
  html+='<p class="q-text" id="qText">'+q.q+'</p><div class="opts" id="opts">';
  q.o.forEach(function(opt,i){
    html+='<button type="button" class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+opt+'</button>';
  });
  html+='</div></div>';
  if(state.round===1)html=renderTrack(0,0)+html;
  if(state.round===2)html=renderTrack(state.pStep,state.cStep)+html;
  if(state.round===3)html=renderTrack(state.pStep,state.cStep)+html;
  $("screen").innerHTML=html;
  document.querySelectorAll(".opt").forEach(function(btn){
    btn.onclick=function(){answer(parseInt(btn.dataset.i,10));};
  });
  if(state.timerMax)startTimer();
}

function startTimer(){
  clearTimer();
  var left=state.timeLeft;
  var fill=$("timerFill");
  timerId=setInterval(function(){
    left-=0.1;
    state.timeLeft=left;
    if(fill){
      var pct=Math.max(0,left/state.timerMax*100);
      fill.style.width=pct+"%";
      fill.classList.toggle("urgent",pct<25);
    }
    if(left<=0){clearTimer();onTimeout();}
  },100);
}

function onTimeout(){
  setMsg("Time's up!");
  sfxWrong();
  setTimeout(nextAfterQuestion,false);
}

function answer(i){
  clearTimer();
  var q=state.currentQ,correct=q.a;
  var btns=document.querySelectorAll(".opt");
  btns.forEach(function(b,idx){
    b.disabled=true;
    if(idx===correct)b.classList.add("correct");
    else if(idx===i)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  var ok=i===correct;
  if(ok){sfxCorrect();handleCorrect();}
  else{sfxWrong();handleWrong();}
  setTimeout(function(){nextAfterQuestion(ok);},1400);
}

function handleCorrect(){
  var d=DIFF[state.diff];
  if(state.round===0){
    state.pot+=d.cash;sfxCash();setMsg("Correct! +£"+d.cash);
  }else if(state.round===1){
    state.pStep=Math.min(state.pStep+1,state.trackSteps);
    moveMarkers(state.pStep,state.cStep,state.trackSteps);
    sfxMove();setMsg("You advance!");
    chaserResponse(false);
  }else{
    state.pStep=Math.min(state.pStep+1,state.trackSteps);
    moveMarkers(state.pStep,state.cStep,state.trackSteps);
    setMsg("Push the chaser back!");
    chaserFinal(false);
  }
  updateHud();
}

function handleWrong(){
  if(state.round===0)setMsg("Wrong — no cash this time.");
  else if(state.round===1){
    setMsg("The chaser closes in!");
    chaserResponse(true);
  }else{
    setMsg("The chaser gains ground!");
    chaserFinal(true);
  }
}

function chaserResponse(playerWrong){
  var d=DIFF[state.diff];
  var chaserCorrect=Math.random()<(playerWrong?d.chaser+0.08:d.chaser);
  if(chaserCorrect){
    state.cStep=Math.min(state.cStep+1,state.trackSteps);
    moveMarkers(state.pStep,state.cStep,state.trackSteps);
    sfxMove();
  }
}

function chaserFinal(playerWrong){
  var d=DIFF[state.diff];
  var advance=Math.random()<(playerWrong?d.chaser+0.1:d.chaser-0.15);
  if(advance&&state.cStep>0){state.cStep--;moveMarkers(state.pStep,state.cStep,state.trackSteps);}
  else if(!playerWrong&&Math.random()<d.chaser*0.5){state.cStep=Math.max(0,state.cStep-1);moveMarkers(state.pStep,state.cStep,state.trackSteps);}
}

function nextAfterQuestion(wasCorrect){
  state.qIndex++;
  if(state.round===0){
    if(state.qIndex>=state.questions.length)return endCashBuilder();
    askCurrent();
  }else if(state.round===1){
    if(state.pStep>=state.trackSteps)return winHeadToHead();
    if(state.cStep>=state.pStep&&state.cStep>=state.trackSteps)return loseHeadToHead();
    if(state.qIndex>=state.questions.length)return state.pStep>state.cStep?winHeadToHead():loseHeadToHead();
    askCurrent();
  }else{
    if(state.cStep<=0)return winFinal();
    if(state.pStep<=0)return loseFinal();
    if(state.qIndex>=state.questions.length)return state.pStep>0?winFinal():loseFinal();
    askCurrent();
  }
}

function askCurrent(){
  state.currentQ=state.questions[state.qIndex];
  state.timeLeft=state.timerMax||DIFF[state.diff].time;
  renderQuestion(state.currentQ);
  setMsg("Question "+(state.qIndex+1)+" of "+state.questions.length);
}

function endCashBuilder(){
  showModal("Cash Builder complete!","You built £"+state.pot.toLocaleString("en-GB")+". Ready for Head-to-Head?",function(){
    startHeadToHead();
  });
}

function startHeadToHead(){
  state.round=1;
  state.trackSteps=7;
  state.pStep=Math.min(Math.floor(state.pot/5000)+1,3);
  state.cStep=0;
  state.questions=pickQuestions(6);
  state.qIndex=0;
  updateHud();
  setMsg("You start "+state.pStep+" steps ahead!");
  askCurrent();
}

function winHeadToHead(){
  showModal("Head-to-Head won!","The chaser didn't catch you. Enter the Final Chase for £"+state.pot.toLocaleString("en-GB")+"!",function(){startFinal();});
}

function loseHeadToHead(){
  showModal("Caught!","The chaser caught you. Better luck next time.",function(){showMenu();});
}

function startFinal(){
  state.round=2;
  state.trackSteps=7;
  state.pStep=state.trackSteps;
  state.cStep=state.trackSteps;
  state.questions=pickQuestions(10);
  state.qIndex=0;
  state.timerMax=DIFF[state.diff].time;
  updateHud();
  setMsg("Final Chase! Keep your lead!");
  askCurrent();
}

function winFinal(){
  state.level++;
  showModal("Grand prize!","You won £"+state.pot.toLocaleString("en-GB")+"! Level "+state.level+" unlocked.",function(){showMenu();});
}

function loseFinal(){
  showModal("Chaser wins","So close! The chaser caught you in the Final Chase.",function(){showMenu();});
}

function startCashBuilder(){
  initAudio();startMusic();
  state.round=0;state.phase="play";state.pot=0;state.qIndex=0;
  state.questions=pickQuestions(8);
  state.timerMax=DIFF[state.diff].time;
  updateHud();
  setMsg("Beat the clock — £"+DIFF[state.diff].cash+" per correct answer!");
  askCurrent();
}

function showMenu(){
  stopMusic();clearTimer();
  state.phase="menu";state.round=-1;state.pot=0;state.level=state.level||1;
  updateHud();
  var html='<div class="panel"><h2>Choose difficulty</h2><p style="font-size:.82rem;color:var(--muted);margin:0 0 8px">Sets chaser strength, question pool &amp; timer — like picking your opponent.</p><div class="diff-grid" id="diffGrid">';
  Object.keys(DIFF).forEach(function(k){
    var d=DIFF[k];
    html+='<button type="button" class="diff-btn'+(state.diff===k?" selected":"")+'" data-d="'+k+'"><b>'+d.label+'</b><small>'+d.desc+'</small></button>';
  });
  html+='</div></div>';
  html+='<div class="panel"><h2>How to play</h2><p style="font-size:.82rem;color:var(--muted);margin:0;line-height:1.5"><strong style="color:var(--gold)">1. Cash Builder</strong> — answer quick-fire questions for money.<br/><strong style="color:var(--gold)">2. Head-to-Head</strong> — race the chaser on the track.<br/><strong style="color:var(--gold)">3. Final Chase</strong> — defend your lead for the jackpot.</p></div>';
  $("screen").innerHTML=html;
  document.querySelectorAll(".diff-btn").forEach(function(b){
    b.onclick=function(){state.diff=b.dataset.d;document.querySelectorAll(".diff-btn").forEach(function(x){x.classList.remove("selected");});b.classList.add("selected");};
  });
  $("controls").innerHTML=
    '<button type="button" class="btn" id="startBtn">Start game</button>'+
    '<button type="button" class="btn secondary" id="soundBtn">'+(musicOn?"🔊 Sound on":"🔇 Sound off")+'</button>';
  $("startBtn").onclick=function(){initAudio();if(!state.diff)state.diff="standard";startCashBuilder();};
  $("soundBtn").onclick=function(){musicOn=!musicOn;$("soundBtn").textContent=musicOn?"🔊 Sound on":"🔇 Sound off";if(musicOn)startMusic();else stopMusic();};
  setMsg("Select difficulty, then tap Start.");
}

state.diff="standard";state.level=1;
showMenu();
document.body.addEventListener("click",function once(){initAudio();startMusic();document.body.removeEventListener("click",once);},{once:true});
})();
</script>
</body>
</html>
