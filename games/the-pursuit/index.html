<style>

  url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 12px 28px;min-height:100dvh;display:flex;flex-direction:column}

@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

@keyframes drift{from{transform:translate(10vw,10vh)}to{transform:translate(60vw,30vh)}}

.name-input{width:100%;font:inherit;font-size:.92rem;padding:10px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:var(--text)}
.name-input:focus{outline:none;border-color:rgba(232,197,71,.45)}

.feed-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}

.led-strip{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--chaser),var(--gold),var(--cyan),var(--gold),var(--chaser));background-size:200% 100%;animation:ledScroll 4s linear infinite;z-index:60;pointer-events:none;opacity:.85}

@keyframes ledScroll{to{background-position:200% 0}}
.clock-wrap{display:flex;justify-content:center;margin:0 0 12px}
.clock-ring{position:relative;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--gold) var(--pct,100%),rgba(255,255,255,.08) 0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(232,197,71,.2),inset 0 0 12px rgba(0,0,0,.5);transition:background .1s linear}
.clock-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel);border:2px solid rgba(232,197,71,.25)}
.clock-ring.urgent{background:conic-gradient(var(--red) var(--pct,100%),rgba(255,255,255,.08) 0);animation:clockPulse .6s infinite alternate}
.clock-num{position:relative;z-index:1;font-size:1.65rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.clock-ring.urgent .clock-num{color:var(--red)}
@keyframes clockPulse{to{transform:scale(1.04)}}
.chaser-panel{display:none;margin:0 0 10px;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(157,2,8,.35),rgba(157,2,8,.15));border:1px solid rgba(230,57,70,.45);align-items:center;gap:10px;animation:chaserIn .35s ease}
.chaser-panel.show{display:flex}
.chaser-panel .av-sm{width:40px;height:40px;border-radius:50%;border:2px solid var(--red);background:linear-gradient(145deg,#5a0a10,#2a0508);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.chaser-panel b{color:#ffb4b4;font-size:.82rem;display:block}
.chaser-panel span{font-size:.72rem;color:var(--muted)}
.chaser-panel.thinking .av-sm{animation:chaserThink .8s infinite alternate}
@keyframes chaserIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes chaserThink{to{transform:scale(1.08);box-shadow:0 0 16px rgba(230,57,70,.5)}}
.round-splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(157,2,8,.35),rgba(7,13,24,.95) 70%);pointer-events:none;opacity:0;transition:opacity .4s}
.round-splash.show{opacity:1}
.round-splash.fade{opacity:0}
.splash-inner{text-align:center;animation:splashPop .6s cubic-bezier(.34,1.4,.64,1)}
.splash-title{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 20px rgba(232,197,71,.4))}
.splash-sub{margin-top:8px;font-size:.95rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
@keyframes splashPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pot-flash{animation:potFlash .6s ease}
@keyframes potFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.08);color:var(--gold2);text-shadow:0 0 12px rgba(232,197,71,.6)}}
.studio-lights{position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 40% 30% at 15% 20%,rgba(78,205,196,.06),transparent),
  radial-gradient(ellipse 40% 30% at 85% 25%,rgba(232,197,71,.07),transparent),
  radial-gradient(ellipse 50% 40% at 50% 0%,rgba(157,2,8,.12),transparent 60%)}
@media(max-width:380px){.diff-grid{grid-template-columns:1fr}}
</style>

<body>
<div class="led-strip" aria-hidden="true"></div>
<div class="led-strip bottom" aria-hidden="true"></div>
<div class="studio-lights" aria-hidden="true"></div>
<div class="spotlight" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="logo">The Pursuit</div>
    <p class="tag">Original UK studio quiz — Cash Builder, Head-to-Head &amp; Final Chase.<br/>Fan-made demo. Not affiliated with any TV broadcast or trademark.</p>
  </header>
  <div class="studio-bar">
    <div class="chip">Level <b id="levelLbl">1</b></div>
    <div class="chip">Pot <b id="potLbl">£0</b></div>
    <div class="chip">Round <b id="roundLbl">—</b></div>
  </div>
  <div id="screen"></div>
  <p class="msg" id="msg"></p>
  <div class="controls" id="controls"></div>
  <p class="legal">Hidden from search engines. Questions are original or general knowledge. No copyrighted show assets used.</p>
</div>
<div class="overlay" id="overlay"><div class="modal"><h3 id="modalTitle">Result</h3><p id="modalText"></p><button type="button" class="btn" id="modalBtn">Continue</button></div></div>
<script src="questions.js"></script>
<script>
(function(){
"use strict";

var DIFF={
  rookie:{label:"Rookie",chaser:.62,cash:500,time:90,pool:["easy","medium"],desc:"Gentler chaser · longer clock"},
  standard:{label:"Standard",chaser:.74,cash:1000,time:75,pool:["easy","medium","hard"],desc:"Balanced · like a weekday show"},
  expert:{label:"Expert",chaser:.84,cash:1500,time:60,pool:["medium","hard"],desc:"Sharper chaser · tougher facts"},
  legend:{label:"Legend",chaser:.93,cash:2000,time:50,pool:["hard","expert"],desc:"Elite chaser · brutal timer"}
};

var ROUNDS=["Cash Builder","Head-to-Head","Final Chase"];
var LS_NAME="pursuit_player_name",LS_SCORES="pursuit_local_scores",LS_PLAYER_ID="pursuit_player_id",LS_LEVEL="pursuit_player_level";
var state={},timerId=null,audioCtx=null,musicOn=true,globalLb=[],lbTab="global",bankTotal=0,questionCache=[],lastTickSec=-1;

function $(id){return document.getElementById(id);}
function setMsg(t){$("msg").textContent=t||"";}
function updateHud(){
  $("levelLbl").textContent=String(state.level||1);
  $("potLbl").textContent="£"+(state.pot||0).toLocaleString("en-GB");
  $("roundLbl").textContent=ROUNDS[state.round]||"Setup";
}

function initAudio(){
  if(audioCtx)return;
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function tone(freq,dur,type,vol){
  if(!audioCtx||!musicOn)return;
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  g.gain.value=vol||.08;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxCorrect(){tone(880,.12,"sine",.1);setTimeout(function(){tone(1100,.15,"sine",.08);},80);}
function sfxWrong(){tone(180,.25,"square",.06);tone(120,.3,"sawtooth",.04);}
function sfxCash(){tone(660,.08,"triangle",.07);setTimeout(function(){tone(990,.1,"triangle",.06);},60);setTimeout(function(){tone(1320,.12,"triangle",.05);},120);}
function sfxMove(){tone(440,.06,"sine",.05);}
function sfxTick(){tone(880,.04,"square",.04);}
function sfxStinger(){tone(220,.25,"sawtooth",.05);setTimeout(function(){tone(330,.3,"triangle",.04);},120);setTimeout(function(){tone(440,.35,"sine",.05);},240);}

var musicTimer=null,tensionTimer=null;
function startMusic(){
  if(!audioCtx||!musicOn||musicTimer)return;
  var bass=[110,98,87,82],i=0;
  musicTimer=setInterval(function(){
    if(!musicOn||state.phase==="menu")return;
    tone(bass[i%bass.length],.22,"sawtooth",.018);
    if(i%2===0)tone(bass[i%bass.length]*2,.12,"triangle",.012);
    i++;
  },620);
  if(!tensionTimer){
    tensionTimer=setInterval(function(){
      if(!musicOn||state.phase!=="play"||state.round<0)return;
      tone(55,.08,"sine",.014);
    },1400);
  }
}
function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
  if(tensionTimer){clearInterval(tensionTimer);tensionTimer=null;}
}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function getPlayerId(){
  try{
    var id=localStorage.getItem(LS_PLAYER_ID);
    if(!id){id="p_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(LS_PLAYER_ID,id);}
    return id;
  }catch(e){return "p_anon";}
}
function formatBankCount(n){
  if(!n)return "743+";
  if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,"")+" million";
  if(n>=1000)return Math.floor(n/1000)+"k+";
  return String(n)+"+";
}
function isValidQuestion(q){
  if(!q||!q.q||!Array.isArray(q.o)||q.o.length!==4)return false;
  var norm=q.o.map(function(s){return String(s).trim().toLowerCase();});
  if(new Set(norm).size!==4)return false;
  var a=Number(q.a);
  return a>=0&&a<=3&&!!String(q.o[a]).trim();
}
function localFallbackPick(n){
  if(!state.usedIds)state.usedIds=new Set();
  var pool=DIFF[state.diff].pool;
  var bank=(window.QUIZ_BANK||[]).filter(function(q){return isValidQuestion(q)&&pool.indexOf(q.d)>=0&&!state.usedIds.has(q.id);});
  if(bank.length<n)bank=(window.QUIZ_BANK||[]).filter(function(q){return isValidQuestion(q)&&!state.usedIds.has(q.id);});
  if(questionCache.length){
    bank=bank.concat(questionCache.filter(function(q){return isValidQuestion(q)&&pool.indexOf(q.d)>=0&&!state.usedIds.has(q.id);}));
  }
  var picked=shuffle(bank).slice(0,n);
  picked.forEach(function(q){if(q.id)state.usedIds.add(q.id);});
  return picked;
}
function fetchQuestionsFromApi(n){
  if(!state.usedIds)state.usedIds=new Set();
  var pool=DIFF[state.diff].pool.join(",");
  var exclude=Array.from(state.usedIds).join(",");
  var url="/api/pursuit-questions?count="+n+"&pool="+encodeURIComponent(pool)+(exclude?"&exclude="+encodeURIComponent(exclude):"");
  return fetch(url).then(function(r){return r.json();}).then(function(data){
    if(data.total)bankTotal=data.total;
    var qs=data.questions||[];
    qs.forEach(function(q){if(q.id)state.usedIds.add(q.id);});
    if(qs.length<n){
      var extra=localFallbackPick(n-qs.length);
      extra.forEach(function(q){if(q.id&&!state.usedIds.has(q.id))state.usedIds.add(q.id);});
      qs=qs.concat(extra).slice(0,n);
    }
    questionCache=questionCache.concat(qs);
    return qs;
  }).catch(function(){
    return localFallbackPick(n);
  });
}
function sendFeedback(questionId,correct){
  if(!questionId)return;
  fetch("/api/pursuit-feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({questionId:questionId,correct:!!correct})}).catch(function(){});
}
function loadRemoteMemory(){
  return fetch("/api/pursuit-memory?playerId="+encodeURIComponent(getPlayerId())).then(function(r){return r.json();}).then(function(data){
    if(data.memory){
      if(data.memory.name)saveName(data.memory.name);
      mergeLevel(data.memory.level);
    }
  }).catch(function(){});
}
function saveRemoteMemory(won){
  var payload={
    playerId:getPlayerId(),
    name:state.playerName||loadName(),
    level:state.level||loadLevel(),
    gamesPlayed:1,
    wins:won?1:0,
    bestPot:state.pot||0,
    preferredDiff:state.diff||"standard"
  };
  return fetch("/api/pursuit-memory?playerId="+encodeURIComponent(getPlayerId())).then(function(r){return r.json();}).then(function(data){
    var m=data.memory||{};
    payload.gamesPlayed=(m.gamesPlayed||0)+1;
    payload.wins=(m.wins||0)+(won?1:0);
    payload.bestPot=Math.max(m.bestPot||0,state.pot||0);
    payload.level=Math.max(m.level||1,state.level||1,loadLevel());
    saveLevel(payload.level);
    return fetch("/api/pursuit-memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  }).catch(function(){
    return fetch("/api/pursuit-memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(function(){});
  });
}
function formatSources(bySource){
  if(!bySource)return "";
  var parts=[];
  if(bySource.news_feed)parts.push(bySource.news_feed+" news");
  if(bySource.opentdb)parts.push(bySource.opentdb+" trivia");
  if(bySource.wikipedia)parts.push(bySource.wikipedia+" history");
  if(bySource.current_events)parts.push(bySource.current_events+" AI");
  if(bySource.seed)parts.push(bySource.seed+" seed");
  return parts.length?" · "+parts.slice(0,4).join(", "):"";
}
function fetchBankStats(){
  fetch("/api/pursuit-stats").then(function(r){return r.json();}).then(function(data){
    bankTotal=data.total||bankTotal;
    var el=$("bankStat");
    if(el)el.textContent="Live question bank: "+formatBankCount(bankTotal)+formatSources(data.bySource)+" · refreshed 06:00 & 18:00 UTC";
  }).catch(function(){});
}
function fetchFeedPanel(){
  fetch("/api/pursuit-feeds").then(function(r){return r.json();}).then(function(data){
    var el=$("feedPanel");
    if(!el)return;
    var tags=(data.sources||[]).slice(0,5).map(function(s){return '<span class="feed-tag">'+escapeHtml(s.name)+'</span>';}).join("");
    tags+='<span class="feed-tag">Open Trivia DB</span><span class="feed-tag">Wikipedia</span>';
    var html='<div class="feed-tags">'+tags+'</div>';
    var list=[];
    if(data.headlines){
      Object.keys(data.headlines).forEach(function(k){
        (data.headlines[k]||[]).slice(0,2).forEach(function(h){list.push({feed:k,title:h});});
      });
    }
    if(list.length){
      html+='<ul class="feed-list">';
      list.slice(0,5).forEach(function(item){
        html+='<li><b>'+escapeHtml(item.feed.replace(/_/g," "))+'</b> · '+escapeHtml(item.title)+'</li>';
      });
      html+='</ul><p style="font-size:.68rem;color:var(--muted);margin:8px 0 0">Headlines become quiz questions — no API keys. MCP: <code style="color:var(--cyan)">GET /api/pursuit-mcp</code></p>';
    }else{
      html+='<p class="lb-empty">Headlines load after the next cron refresh (06:00 / 18:00 UTC).</p>';
    }
    el.innerHTML=html;
  }).catch(function(){
    var el=$("feedPanel");
    if(el)el.innerHTML='<p class="lb-empty">News feeds unavailable — offline bank still works.</p>';
  });
}

function loadName(){try{return localStorage.getItem(LS_NAME)||"";}catch(e){return "";}}
function saveName(n){try{localStorage.setItem(LS_NAME,n);}catch(e){}}
function loadLevel(){
  try{var n=parseInt(localStorage.getItem(LS_LEVEL),10);return n>0?n:1;}catch(e){return 1;}
}
function saveLevel(n){
  n=Math.max(1,Math.min(999,Math.floor(Number(n)||1)));
  state.level=n;
  try{localStorage.setItem(LS_LEVEL,String(n));}catch(e){}
  updateHud();
}
function mergeLevel(remote){
  var merged=Math.max(state.level||1,loadLevel(),remote||1);
  saveLevel(merged);
  return merged;
}
function loadLocalScores(){try{return JSON.parse(localStorage.getItem(LS_SCORES)||"[]");}catch(e){return [];}}
function addLocalScore(entry){
  var scores=loadLocalScores();
  scores.push(entry);
  scores.sort(function(a,b){return b.score-a.score||b.at-a.at;});
  try{localStorage.setItem(LS_SCORES,JSON.stringify(scores.slice(0,25)));}catch(e){}
}
function formatScore(n){return "£"+(n||0).toLocaleString("en-GB");}
function formatLbRows(entries,emptyMsg){
  if(!entries||!entries.length)return '<p class="lb-empty">'+emptyMsg+'</p>';
  var html='<table class="lb-table"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>Level</th></tr></thead><tbody>';
  entries.slice(0,15).forEach(function(e,i){
    var diff=(e.difficulty||e.diff||"—").replace(/^./,function(c){return c.toUpperCase();});
    html+='<tr><td>'+(i+1)+'</td><td>'+escapeHtml(e.name)+'</td><td class="score">'+formatScore(e.score)+'</td><td>'+escapeHtml(diff)+(e.won?" ✓":"")+'</td></tr>';
  });
  return html+'</tbody></table>';
}
function escapeHtml(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function renderLeaderboardPanel(){
  var el=$("lbPanel");
  if(!el)return;
  var body=lbTab==="global"?formatLbRows(globalLb,"No global scores yet — finish a game to appear here!"):formatLbRows(loadLocalScores(),"Play a game to record your best scores on this device.");
  el.querySelector(".lb-body").innerHTML=body;
  el.querySelectorAll(".lb-tab").forEach(function(t){t.classList.toggle("active",t.dataset.tab===lbTab);});
}
function fetchGlobalLeaderboard(){
  fetch("/api/pursuit-leaderboard").then(function(r){return r.json();}).then(function(data){
    globalLb=data.entries||[];
    renderLeaderboardPanel();
  }).catch(function(){globalLb=[];renderLeaderboardPanel();});
}
function submitScore(won){
  var name=(state.playerName||loadName()||"").trim();
  if(!name)name="Player";
  var entry={name:name,score:state.pot||0,difficulty:state.diff||"standard",won:!!won,at:Date.now()};
  addLocalScore(entry);
  fetch("/api/pursuit-leaderboard",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:name,score:entry.score,difficulty:entry.difficulty,won:entry.won})
  }).then(function(){fetchGlobalLeaderboard();}).catch(function(){});
  renderLeaderboardPanel();
}

function renderTrack(playerStep,chaserStep,steps){
  steps=steps||7;
  var html='<div class="track-wrap"><div class="track" id="trackEl">';
  for(var s=0;s<=steps;s++){
    html+='<div class="step'+(s===steps?' win':'')+'"><div class="step-dot"></div></div>';
  }
  var pw=(playerStep/steps)*84+8,pct=(chaserStep/steps)*84+8;
  html+='<div class="marker player" id="playerMark" style="left:'+pw+'%"><div class="av">🎯</div><span>You</span></div>';
  html+='<div class="marker chaser" id="chaserMark" style="left:'+pct+'%"><div class="av">🏹</div><span>Chaser</span></div>';
  html+='</div></div>';
  return html;
}

function moveMarkers(pStep,cStep,steps){
  steps=steps||7;
  var p=$("playerMark"),c=$("chaserMark");
  if(p)p.style.left=(pStep/steps*84+8)+"%";
  if(c)c.style.left=(cStep/steps*84+8)+"%";
}

function showModal(title,text,cb){
  $("modalTitle").textContent=title;
  $("modalText").textContent=text;
  $("overlay").classList.add("show");
  $("modalBtn").onclick=function(){$("overlay").classList.remove("show");if(cb)cb();};
}

function clearTimer(){if(timerId){clearInterval(timerId);timerId=null;}lastTickSec=-1;}

function showRoundIntro(title,subtitle,cb){
  var el=document.createElement("div");
  el.className="round-splash show";
  el.innerHTML='<div class="splash-inner"><div class="splash-title">'+escapeHtml(title)+'</div><div class="splash-sub">'+escapeHtml(subtitle)+'</div></div>';
  document.body.appendChild(el);
  sfxStinger();
  setTimeout(function(){
    el.classList.add("fade");
    setTimeout(function(){el.remove();if(cb)cb();},500);
  },1700);
}

function showChaserPanel(thinking,msg){
  var panel=$("chaserPanel");
  if(!panel)return;
  panel.classList.add("show");
  panel.classList.toggle("thinking",!!thinking);
  var sub=panel.querySelector(".chaser-msg");
  if(sub)sub.textContent=msg||(thinking?"The Chaser is answering…":"The Chaser responds!");
}
function hideChaserPanel(){
  var panel=$("chaserPanel");
  if(panel){panel.classList.remove("show","thinking");}
}

function renderQuestion(q){
  var html="";
  if(state.round>=1)html+=renderTrack(state.pStep||0,state.cStep||0,state.trackSteps||7);
  html+='<div class="panel"><h2>'+ROUNDS[state.round]+'</h2>';
  if(state.round>=1){
    html+='<div class="chaser-panel" id="chaserPanel"><div class="av-sm">🏹</div><div><b>The Chaser</b><span class="chaser-msg">Waiting for your answer…</span></div></div>';
  }
  if(state.timerMax){
    html+='<div class="clock-wrap"><div class="clock-ring" id="clockRing"><span class="clock-num" id="clockNum">'+Math.ceil(state.timeLeft)+'</span></div></div>';
  }
  html+='<p class="q-text" id="qText">'+escapeHtml(q.q)+'</p><div class="opts" id="opts">';
  q.o.forEach(function(opt,i){
    html+='<button type="button" class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+escapeHtml(opt)+'</button>';
  });
  html+='</div></div>';
  $("screen").innerHTML=html;
  document.querySelectorAll(".opt").forEach(function(btn){
    btn.onclick=function(){answer(parseInt(btn.dataset.i,10));};
  });
  if(state.timerMax)startTimer();
}

function startTimer(){
  clearTimer();
  var left=state.timeLeft;
  var ring=$("clockRing"),num=$("clockNum");
  function paint(){
    var pct=Math.max(0,left/state.timerMax*100);
    if(ring){
      ring.style.setProperty("--pct",pct+"%");
      ring.classList.toggle("urgent",left<=5);
    }
    if(num)num.textContent=String(Math.max(0,Math.ceil(left)));
    var sec=Math.ceil(left);
    if(sec<=5&&sec!==lastTickSec&&left>0){lastTickSec=sec;sfxTick();}
  }
  paint();
  timerId=setInterval(function(){
    left-=0.1;
    state.timeLeft=left;
    paint();
    if(left<=0){clearTimer();onTimeout();}
  },100);
}

function onTimeout(){
  setMsg("Time's up!");
  sfxWrong();
  setTimeout(nextAfterQuestion,false);
}

function showAnswerResult(i,correct,ok){
  var btns=document.querySelectorAll(".opt");
  btns.forEach(function(b,idx){
    b.disabled=true;
    if(idx===correct)b.classList.add("correct");
    else if(idx===i)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(ok){sfxCorrect();handleCorrect();}
  else{sfxWrong();handleWrong();}
  var delay=state.round>=1?2400:1400;
  setTimeout(function(){nextAfterQuestion(ok);},delay);
}
function answer(i){
  clearTimer();
  var q=state.currentQ;
  if(typeof q.a==="number"){
    var ok=i===q.a;
    sendFeedback(q.id,ok);
    showAnswerResult(i,q.a,ok);
    return;
  }
  fetch("/api/pursuit-check-answer",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({questionId:q.id,choice:i})
  }).then(function(r){return r.json();}).then(function(data){
    if(data.error){setMsg("Could not verify answer.");showAnswerResult(i,i,false);return;}
    sendFeedback(q.id,data.correct);
    showAnswerResult(i,data.answer,data.correct);
  }).catch(function(){
    setMsg("Could not verify answer.");
    showAnswerResult(i,i,false);
  });
}

function flashPot(){
  var el=$("potLbl");
  if(el){el.classList.remove("pot-flash");void el.offsetWidth;el.classList.add("pot-flash");}
}

function handleCorrect(){
  var d=DIFF[state.diff];
  if(state.round===0){
    state.pot+=d.cash;sfxCash();flashPot();setMsg("Correct! +£"+d.cash);
  }else if(state.round===1){
    state.pStep=Math.min(state.pStep+1,state.trackSteps);
    moveMarkers(state.pStep,state.cStep,state.trackSteps);
    sfxMove();setMsg("You advance!");
    chaserResponse(false);
  }else{
    state.pStep=Math.min(state.pStep+1,state.trackSteps);
    moveMarkers(state.pStep,state.cStep,state.trackSteps);
    setMsg("Push the chaser back!");
    chaserFinal(false);
  }
  updateHud();
}

function handleWrong(){
  if(state.round===0)setMsg("Wrong — no cash this time.");
  else if(state.round===1){
    setMsg("The chaser closes in!");
    chaserResponse(true);
  }else{
    setMsg("The chaser gains ground!");
    chaserFinal(true);
  }
}

function chaserResponse(playerWrong){
  var d=DIFF[state.diff];
  showChaserPanel(true,playerWrong?"The Chaser smells blood…":"Can the Chaser keep up?");
  setTimeout(function(){
    var chaserCorrect=Math.random()<(playerWrong?d.chaser+0.08:d.chaser);
    if(chaserCorrect){
      state.cStep=Math.min(state.cStep+1,state.trackSteps);
      moveMarkers(state.pStep,state.cStep,state.trackSteps);
      sfxMove();
      showChaserPanel(false,"The Chaser moves forward!");
      setMsg("The Chaser gains a step!");
    }else{
      showChaserPanel(false,"The Chaser got it wrong!");
      setMsg("The Chaser stumbles!");
    }
    setTimeout(hideChaserPanel,900);
  },900);
}

function chaserFinal(playerWrong){
  showChaserPanel(true,playerWrong?"The Chaser is closing in…":"You're pushing back!");
  setTimeout(function(){
    var d=DIFF[state.diff];
    var advance=Math.random()<(playerWrong?d.chaser+0.1:d.chaser-0.15);
    if(advance&&state.cStep>0){
      state.cStep--;
      moveMarkers(state.pStep,state.cStep,state.trackSteps);
      sfxMove();
      showChaserPanel(false,"The Chaser retreats!");
      setMsg("The chaser pushed back!");
    }else if(!playerWrong&&Math.random()<d.chaser*0.5){
      state.cStep=Math.max(0,state.cStep-1);
      moveMarkers(state.pStep,state.cStep,state.trackSteps);
      showChaserPanel(false,"Brilliant push!");
      setMsg("You pushed the chaser back!");
    }else{
      showChaserPanel(false,"No change on the board.");
    }
    setTimeout(hideChaserPanel,900);
  },900);
}

function nextAfterQuestion(wasCorrect){
  state.qIndex++;
  if(state.round===0){
    if(state.qIndex>=state.questions.length)return endCashBuilder();
    askCurrent();
  }else if(state.round===1){
    if(state.pStep>=state.trackSteps)return winHeadToHead();
    if(state.cStep>=state.pStep&&state.cStep>=state.trackSteps)return loseHeadToHead();
    if(state.qIndex>=state.questions.length)return state.pStep>state.cStep?winHeadToHead():loseHeadToHead();
    askCurrent();
  }else{
    if(state.cStep<=0)return winFinal();
    if(state.pStep<=0)return loseFinal();
    if(state.qIndex>=state.questions.length)return state.pStep>0?winFinal():loseFinal();
    askCurrent();
  }
}

function askCurrent(){
  state.currentQ=state.questions[state.qIndex];
  state.timeLeft=state.timerMax||DIFF[state.diff].time;
  renderQuestion(state.currentQ);
  setMsg("Question "+(state.qIndex+1)+" of "+state.questions.length);
}

function endCashBuilder(){
  showModal("Cash Builder complete!","You built £"+state.pot.toLocaleString("en-GB")+". Ready for Head-to-Head?",function(){
    showRoundIntro("Head-to-Head","Race the Chaser on the track",startHeadToHead);
  });
}

function startHeadToHead(){
  state.round=1;
  state.trackSteps=7;
  state.pStep=Math.min(Math.floor(state.pot/5000)+1,3);
  state.cStep=0;
  beginRound(6,"You start "+state.pStep+" steps ahead!",askCurrent);
}

function winHeadToHead(){
  showModal("Head-to-Head won!","The chaser didn't catch you. Enter the Final Chase for £"+state.pot.toLocaleString("en-GB")+"!",function(){
    showRoundIntro("Final Chase","Defend your lead for the jackpot",startFinal);
  });
}

function loseHeadToHead(){
  submitScore(false);
  saveRemoteMemory(false);
  showModal("Caught!","The chaser caught you. You built "+formatScore(state.pot)+". Better luck next time.",function(){showMenu();});
}

function startFinal(){
  state.round=2;
  state.trackSteps=7;
  state.pStep=state.trackSteps;
  state.cStep=state.trackSteps;
  state.timerMax=DIFF[state.diff].time;
  beginRound(10,"Final Chase! Keep your lead!",askCurrent);
}

function winFinal(){
  submitScore(true);
  saveLevel((state.level||loadLevel())+1);
  saveRemoteMemory(true);
  showModal("Grand prize!","You won "+formatScore(state.pot)+"! Level "+state.level+" unlocked.",function(){showMenu();});
}

function loseFinal(){
  submitScore(false);
  saveRemoteMemory(false);
  showModal("Chaser wins","So close! The chaser caught you in the Final Chase. You built "+formatScore(state.pot)+".",function(){showMenu();});
}

function beginRound(questionCount,msg,next){
  setMsg("Loading questions…");
  fetchQuestionsFromApi(questionCount).then(function(qs){
    state.questions=qs;
    state.qIndex=0;
    updateHud();
    setMsg(msg);
    next();
  });
}

function startCashBuilder(){
  initAudio();startMusic();
  state.round=0;state.phase="play";state.pot=0;state.qIndex=0;state.usedIds=new Set();
  state.playerName=(loadName()||"").trim();
  state.timerMax=DIFF[state.diff].time;
  showRoundIntro("Cash Builder","Beat the clock for £"+DIFF[state.diff].cash+" per correct answer",function(){
    beginRound(8,"Quick fire — every second counts!",askCurrent);
  });
}

function showMenu(){
  stopMusic();clearTimer();
  state.phase="menu";state.round=-1;state.pot=0;
  mergeLevel(state.level);
  var html='<div class="panel"><h2>Choose difficulty</h2><p style="font-size:.82rem;color:var(--muted);margin:0 0 8px">Sets chaser strength, question pool &amp; timer — like picking your opponent.</p><div class="diff-grid" id="diffGrid">';
  Object.keys(DIFF).forEach(function(k){
    var d=DIFF[k];
    html+='<button type="button" class="diff-btn'+(state.diff===k?" selected":"")+'" data-d="'+k+'"><b>'+d.label+'</b><small>'+d.desc+'</small></button>';
  });
  html+='</div></div>';
  html+='<p class="bank-stat" id="bankStat">Live question bank: loading…</p>';
  html+='<div class="panel"><h2>Today&apos;s news feeds</h2><p style="font-size:.78rem;color:var(--muted);margin:0 0 8px">BBC RSS, Open Trivia DB &amp; Wikipedia — free sources, no login. New questions twice daily.</p><div id="feedPanel"><p class="lb-empty">Loading feeds…</p></div></div>';
  html+='<div class="panel"><h2>Your name</h2><p style="font-size:.78rem;color:var(--muted);margin:0 0 8px">Saved on this device + cloud memory (via MCP/KV). Shown on the leaderboard.</p>';
  html+='<input type="text" class="name-input" id="playerName" maxlength="20" placeholder="Enter your name" autocomplete="nickname" value="'+escapeHtml(loadName())+'"/></div>';
  html+='<div class="panel" id="lbPanel"><h2>Leaderboard</h2>';
  html+='<div class="lb-tabs"><button type="button" class="lb-tab active" data-tab="global">Global</button><button type="button" class="lb-tab" data-tab="local">This device</button></div>';
  html+='<div class="lb-body"><p class="lb-empty">Loading scores…</p></div></div>';
  html+='<div class="panel"><h2>How to play</h2><p style="font-size:.82rem;color:var(--muted);margin:0;line-height:1.5"><strong style="color:var(--gold)">1. Cash Builder</strong> — answer quick-fire questions for money.<br/><strong style="color:var(--gold)">2. Head-to-Head</strong> — race the chaser on the track.<br/><strong style="color:var(--gold)">3. Final Chase</strong> — defend your lead for the jackpot.<br/><span style="color:var(--cyan)">No repeats per game · bank grows from news feeds + AI twice daily.</span></p></div>';
  $("screen").innerHTML=html;
  document.querySelectorAll(".diff-btn").forEach(function(b){
    b.onclick=function(){state.diff=b.dataset.d;document.querySelectorAll(".diff-btn").forEach(function(x){x.classList.remove("selected");});b.classList.add("selected");};
  });
  var nameEl=$("playerName");
  nameEl.onchange=function(){saveName(nameEl.value.trim());};
  nameEl.onblur=function(){saveName(nameEl.value.trim());};
  document.querySelectorAll(".lb-tab").forEach(function(t){
    t.onclick=function(){lbTab=t.dataset.tab;renderLeaderboardPanel();};
  });
  renderLeaderboardPanel();
  fetchGlobalLeaderboard();
  fetchBankStats();
  fetchFeedPanel();
  loadRemoteMemory();
  $("controls").innerHTML=
    '<button type="button" class="btn" id="startBtn">Start game</button>'+
    '<button type="button" class="btn secondary" id="soundBtn">'+(musicOn?"🔊 Sound on":"🔇 Sound off")+'</button>';
  $("startBtn").onclick=function(){
    initAudio();
    if(!state.diff)state.diff="standard";
    var n=(nameEl.value||"").trim();
    if(n){saveName(n);state.playerName=n;}
    startCashBuilder();
  };
  $("soundBtn").onclick=function(){musicOn=!musicOn;$("soundBtn").textContent=musicOn?"🔊 Sound on":"🔇 Sound off";if(musicOn)startMusic();else stopMusic();};
  setMsg("Enter your name, pick difficulty, then tap Start.");
}

state.diff="standard";state.level=loadLevel();
loadRemoteMemory().finally(showMenu);
document.body.addEventListener("click",function once(){initAudio();startMusic();document.body.removeEventListener("click",once);},{once:true});
})();
</script>
</body>
